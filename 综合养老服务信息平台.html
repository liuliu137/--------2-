<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合养老服务信息平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%230a6fd6'/%3E%3Cpath d='M12 5.2 17 9l-2 8h-6l-2-8z' fill='%23fff'/%3E%3Cpath d='M12 5.2l2.2 1.6-1 4.4h-2.4l-1-4.4z' fill='%23ffd76a'/%3E%3C/svg%3E">
<style>
:root{
  --bg-0:#030d1f;--bg-1:#071a38;--bg-2:#0b2450;
  --panel:rgba(9,30,64,.78);--panel-2:rgba(13,42,88,.55);
  --line:rgba(64,160,255,.32);--line-soft:rgba(64,160,255,.16);
  --cyan:#39c8ff;--cyan-2:#7fd9ff;--gold:#ffd76a;--gold-2:#ffe6a3;
  --white:#eaf4ff;--dim:#9ec3e6;
  --font:'Microsoft YaHei','PingFang SC','Noto Sans SC',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--white);
  background:
    radial-gradient(1200px 700px at 50% -10%, #123a75 0%, transparent 60%),
    radial-gradient(900px 600px at 85% 110%, #0c2f63 0%, transparent 55%),
    radial-gradient(800px 600px at 8% 108%, #0d2f66 0%, transparent 55%),
    linear-gradient(160deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
  background-attachment:fixed;overflow:hidden;-webkit-font-smoothing:antialiased;
}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(64,160,255,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(64,160,255,.07) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, #000 30%, transparent 75%);
  mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, #000 30%, transparent 75%);
}
.corner{position:fixed;width:64px;height:64px;z-index:1;pointer-events:none;opacity:.7}
.corner.tl{top:0;left:0;border-top:2px solid var(--line);border-left:2px solid var(--line)}
.corner.tr{top:0;right:0;border-top:2px solid var(--line);border-right:2px solid var(--line)}
.corner.bl{bottom:0;left:0;border-bottom:2px solid var(--line);border-left:2px solid var(--line)}
.corner.br{bottom:0;right:0;border-bottom:2px solid var(--line);border-right:2px solid var(--line)}
.vline{position:fixed;top:0;bottom:0;width:1px;background:linear-gradient(to bottom, transparent, var(--line-soft) 20%, var(--line-soft) 80%, transparent);opacity:.5;z-index:1;pointer-events:none}
.vline.l{left:34%}.vline.r{right:34%}
.topbar{position:relative;z-index:5;text-align:center;padding:26px 16px 6px}
.plate{display:flex;align-items:center;gap:16px;justify-content:center}
.logo-badge{width:44px;height:44px;flex:none}
.title{font-size:clamp(26px, 3.4vw, 44px);font-weight:800;letter-spacing:.06em;
  background:linear-gradient(180deg, #fff 0%, #d6ecff 45%, #7fc7ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(70,170,255,.35)}
.title .hi{font-weight:300;letter-spacing:.3em;font-size:.5em;vertical-align:.35em;margin-left:.4em;
  background:linear-gradient(180deg,#fff,#9fd0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.titlebar-line{width:min(640px,80vw);height:2px;margin:12px auto 0;
  background:linear-gradient(90deg,transparent,#39c8ff 30%,#39c8ff 70%,transparent);position:relative}
.titlebar-line::before{content:"";position:absolute;left:50%;top:-3px;width:8px;height:8px;transform:translateX(-50%) rotate(45deg);background:#39c8ff;box-shadow:0 0 12px #39c8ff}
.date-chip{position:absolute;top:14px;right:20px;z-index:6;font-size:12px;color:var(--dim);
  border:1px solid var(--line-soft);background:var(--panel-2);padding:5px 12px;border-radius:20px;letter-spacing:.04em}
.date-chip b{color:var(--cyan-2);font-weight:600;margin-left:4px}
.stage{position:relative;z-index:5;height:calc(100% - 190px);min-height:440px;
  display:grid;grid-template-columns:1.06fr 1.52fr 1.06fr;gap:16px;
  padding:10px 22px 4px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:10px}
.column-title{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--cyan-2);
  letter-spacing:.1em;margin:0 2px 3px;font-weight:700}
.column-title::before{content:"";width:5px;height:16px;background:linear-gradient(var(--cyan),transparent);border-radius:2px}
.column-title .count{margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:0}
.nav-card{position:relative;flex:1;display:flex;align-items:center;gap:14px;
  padding:18px 20px;border:1px solid var(--line-soft);border-radius:10px;
  background:linear-gradient(135deg, var(--panel-2), rgba(8,26,58,.55));
  cursor:pointer;overflow:hidden;transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;min-height:66px}
.nav-card::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 20%, rgba(80,180,255,.12) 50%, transparent 80%);
  transform:translateX(-120%);transition:transform .45s ease}
.nav-card:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 6px 22px rgba(20,120,230,.25)}
.nav-card:hover::after{transform:translateX(120%)}
.nav-ico{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:10px;
  background:linear-gradient(160deg, rgba(57,200,255,.2), rgba(57,200,255,.05));border:1px solid var(--line-soft)}
.nav-ico svg{width:34px;height:34px;stroke:var(--cyan-2)}
.nav-info{min-width:0}
.nav-name{font-size:22px;font-weight:700;letter-spacing:.03em}
.nav-desc{font-size:13.5px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-arrow{position:absolute;right:16px;font-size:22px;color:var(--line);transition:color .18s,transform .18s}
.nav-card:hover .nav-arrow{color:var(--cyan);transform:translateX(2px)}
.center{display:flex;flex-direction:column;align-items:center;position:relative}
#globe-wrap{position:absolute;inset:0;display:grid;place-items:center}
#globe{width:100%;height:100%}
.globe-cap{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;text-align:center}
.globe-cap .t{font-size:14px;letter-spacing:.16em;color:var(--cyan-2);font-weight:600}
.globe-cap .s{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.08em}
.globe-foot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:18px}
.gstat{text-align:center;padding:6px 16px;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel-2)}
.gstat .n{font-size:20px;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}
.gstat .l{font-size:10.5px;color:var(--dim);margin-top:1px;letter-spacing:.08em}
#loc-tip{position:absolute;z-index:4;pointer-events:none;display:none;
  background:rgba(3,13,31,.92);border:1px solid var(--cyan);border-radius:6px;
  padding:7px 12px;font-size:12px;color:var(--white);white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#loc-tip .d{color:var(--cyan-2);font-size:11px;margin-top:2px}
.footer{position:relative;z-index:6;text-align:center;padding:8px 20px 16px}
.footer .line{width:min(760px,86vw);height:1px;margin:0 auto 10px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.footer .org{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap}
.footer .org span{font-size:13px;color:var(--dim);letter-spacing:.05em}
.footer .org b{color:var(--white);font-weight:600}
.footer .org .div{width:1px;height:14px;background:var(--line-soft)}
.footer .clr{width:min(520px,80vw);height:2px;margin:8px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cyan) 25%,var(--gold) 50%,var(--cyan) 75%,transparent);opacity:.7}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,8,18,.72);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{width:min(920px,94vw);max-height:88vh;overflow:auto;
  background:linear-gradient(160deg,#0a2148,#071a38 60%,#061631);
  border:1px solid var(--line);border-radius:12px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:rgba(57,200,255,.4);border-radius:4px}
.modal-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-soft);padding-bottom:14px;margin-bottom:18px}
.modal-head .ico{width:42px;height:42px;display:grid;place-items:center;border-radius:9px;
  background:linear-gradient(160deg,rgba(57,200,255,.25),rgba(57,200,255,.05));border:1px solid var(--line-soft)}
.modal-head .ico svg{width:26px;height:26px;stroke:var(--cyan-2)}
.modal-head h2{font-size:20px;font-weight:800;letter-spacing:.04em}
.modal-head .sub{font-size:12px;color:var(--dim);margin-top:3px}
.modal-close{margin-left:auto;width:34px;height:34px;border:1px solid var(--line-soft);border-radius:8px;background:transparent;color:var(--dim);font-size:18px;cursor:pointer;transition:.18s}
.modal-close:hover{border-color:var(--cyan);color:var(--cyan)}
.modal-body{color:#cfe4f8}
.modal-body h3{font-size:15px;color:var(--cyan-2);margin:18px 0 10px;font-weight:700;letter-spacing:.05em}
.modal-body h3:first-child{margin-top:0}
.modal-body p{font-size:13.5px;line-height:1.85;color:#c3dcf5}
.modal-body ul{padding-left:20px}
.modal-body li{font-size:13.5px;line-height:1.9;color:#c3dcf5}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.metric{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:14px;text-align:center}
.metric .n{font-size:26px;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}
.metric .l{font-size:12px;color:var(--dim);margin-top:4px}
.chart-box{height:260px;margin-top:8px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:6px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{font-size:12px;color:var(--cyan-2);border:1px solid var(--line-soft);padding:4px 12px;border-radius:20px;background:rgba(57,200,255,.06)}
.item-list{margin-top:6px}
.item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px dashed rgba(64,160,255,.14)}
.item .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.item .tx{flex:1}
.item .tx b{font-size:14px;color:#e6f4ff;font-weight:600}
.item .tx span{font-size:12.5px;color:var(--dim)}
.item .st{font-size:12px;color:var(--gold-2);flex:none;white-space:nowrap}
.desc-banner{background:linear-gradient(90deg,rgba(57,200,255,.12),rgba(57,200,255,.02));border-left:3px solid var(--cyan);padding:12px 16px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.8;color:#d5ecff}
@media (max-width:980px){
  .stage{grid-template-columns:1fr;height:auto;overflow:auto}
  .center{min-height:420px}
  .col{gap:8px}
  .nav-card{min-height:50px;padding:12px 14px}
  .nav-name{font-size:17px}
  .nav-ico{width:44px;height:44px}
  .nav-ico svg{width:26px;height:26px}
  body{overflow:auto}
  .vline{display:none}
  .date-chip{position:static;display:inline-block;margin:8px auto 0}
  .topbar{text-align:center}
  .plate{flex-direction:column;gap:8px}
  .metric-grid{grid-template-columns:1fr}
}
@media (max-width:520px){
  .title{font-size:22px}
  .nav-desc{display:none}
  .globe-foot{gap:8px}
  .gstat{padding:5px 10px}
  .gstat .n{font-size:16px}
  .footer .org{gap:12px}
  .footer .org .div{display:none}
  .footer .org span{font-size:12px}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="vline l"></div><div class="vline r"></div>

<header class="topbar">
  <div class="plate">
    <svg class="logo-badge" viewBox="0 0 48 48" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa9ff"/><stop offset="1" stop-color="#0a5ec2"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22" fill="url(#lg)" stroke="#39c8ff" stroke-width="1.4"/>
      <circle cx="24" cy="24" r="16.5" fill="none" stroke="rgba(255,255,255,.5)" stroke-dasharray="3 4"/>
      <path d="M24 10 32 19l-3 12H19l-3-12z" fill="#fff"/>
      <path d="M24 10l3.6 2.8-1.8 8H22.2l-1.8-8z" fill="#ffd76a"/>
      <circle cx="24" cy="13" r="1.6" fill="#ffd76a"/>
    </svg>
    <h1 class="title">综合养老服务信息平台<span class="hi">智慧苍溪</span></h1>
  </div>
  <div class="titlebar-line"></div>
  <div class="date-chip" id="date-chip">今天 <b id="today"></b></div>
</header>

<main class="stage">
  <aside class="col">
    <div class="column-title">民生服务<span class="count">6 项</span></div>
    <div class="nav-card" data-panel="mingsheng"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M10 20v-5h4v5"/></svg></span><span class="nav-info"><span class="nav-name">民生项目</span><span class="nav-desc">养老民生实事工程台账</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="yanglao"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v15"/><path d="M13 21h7v-8a2 2 0 0 0-2-2h-5v10"/><path d="M2 21h20"/></svg></span><span class="nav-info"><span class="nav-name">养老机构</span><span class="nav-desc">全县养老院/幸福院一览</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="renkou"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span><span class="nav-info"><span class="nav-name">人口地图</span><span class="nav-desc">老年人口空间分布</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="gongxu"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16" cy="16" r="3.2"/><path d="M8 11.2V20M16 12.8V4M8 15.5h2M16 8.5h-2"/></svg></span><span class="nav-info"><span class="nav-name">供需对接</span><span class="nav-desc">养老服务供需智能撮合</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="shicheng"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></span><span class="nav-info"><span class="nav-name">适老商城</span><span class="nav-desc">适老化产品与服务商城</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="shegong"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.3"/><path d="M15.5 15.5a4.6 4.6 0 0 1 5 4.5"/></svg></span><span class="nav-info"><span class="nav-name">社会工作者</span><span class="nav-desc">社工人才队伍与网格</span></span><span class="nav-arrow">&#8250;</span></div>
  </aside>

  <section class="center">
    <div class="globe-cap"><div class="t">苍溪县 · 养老资源全景</div><div class="s">县-乡镇-村（社区）三级联动 · 一屏统览</div></div>
    <div id="globe-wrap"><canvas id="globe"></canvas></div>
    <div id="loc-tip"></div>
    <div class="globe-foot">
      <div class="gstat"><div class="n" data-num="72">0</div><div class="l">养老机构</div></div>
      <div class="gstat"><div class="n" data-num="856">0</div><div class="l">社工人员</div></div>
      <div class="gstat"><div class="n" data-num="1264">0</div><div class="l">老年人口（万）</div></div>
    </div>
  </section>

  <aside class="col">
    <div class="column-title">综合数据<span class="count">5 项</span></div>
    <div class="nav-card" data-panel="chaxun"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/><path d="M8 11h6M11 8v6"/></svg></span><span class="nav-info"><span class="nav-name">数据查询</span><span class="nav-desc">业务数据一站式检索</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="tongji"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="8"/><rect x="12" y="8" width="3" height="12"/><rect x="17" y="14" width="3" height="6"/></svg></span><span class="nav-info"><span class="nav-name">统计图表</span><span class="nav-desc">多维数据可视化分析</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="xiangmu"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5z"/><path d="M8 11h8M8 15h5"/></svg></span><span class="nav-info"><span class="nav-name">项目数据</span><span class="nav-desc">项目全生命周期跟踪</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="dangjian"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10M8 21v-6.5a4 4 0 0 1 8 0V21"/><path d="M12 4.5V6M12 6c2 1 3.2 2.4 3.2 4H8.8c0-1.6 1.2-3 3.2-4z"/></svg></span><span class="nav-info"><span class="nav-name">党建成果</span><span class="nav-desc">党建引领养老服务成果</span></span><span class="nav-arrow">&#8250;</span></div>
    <div class="nav-card" data-panel="yanglaocg"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 21l5-2.6L17 21l-1.5-7"/></svg></span><span class="nav-info"><span class="nav-name">养老成果</span><span class="nav-desc">养老服务体系建设成效</span></span><span class="nav-arrow">&#8250;</span></div>
  </aside>
</main>

<footer class="footer">
  <div class="line"></div>
  <div class="org">
    <span>主办：<b>苍溪县民政局</b></span>
    <span class="div"></span>
    <span>技术支持：<b>成都全景网络发展有限公司</b></span>
  </div>
  <div class="clr"></div>
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="ico" id="m-ico"></div>
      <div><h2 id="m-title">栏目</h2><div class="sub" id="m-sub"></div></div>
      <button class="modal-close" id="m-close" aria-label="关闭">&times;</button>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

mingsheng:{name:'民生项目',sub:'养老领域民生实事工程台账',html:function(){return '<div class="desc-banner">集中展示苍溪县当年实施的养老服务民生实事项目，涵盖建设进度、资金投入、责任单位与完成情况，实现项目全周期动态管理。</div><h3>年度重点项目（示例）</h3><div class="item-list">'+row('乡镇区域养老服务中心建设','新建 12 个中心，覆盖重点乡镇','在建')+row('幸福院适老化改造','完成 860 户困难家庭适老化改造','已完成')+row('社区助餐点建设','新增社区老年食堂助餐点 18 个','推进中')+row('智慧养老平台二期','平台功能升级与数据对接','立项')+'</div><h3>关键指标</h3><div class="metric-grid">'+metric('128','项目总数（个）')+metric('86.4%','平均完成率')+metric('2.6亿','年度投入（元）')+'</div>';}},
yanglao:{name:'养老机构',sub:'全县养老机构分布与运营情况',html:function(){return '<div class="desc-banner">归集全县公办与民办养老机构、敬老院、幸福院及社区日间照料中心信息，支持按区域、类型筛选查看床位与入住情况。</div><h3>机构类型分布（示例）</h3><div class="metric-grid">'+metric('38','公办养老机构')+metric('21','民办养老机构')+metric('13','社区日间照料中心')+'</div><h3>重点机构（示例）</h3><div class="item-list">'+row('苍溪县社会福利中心','公办 · 床位 320 张 · 入住率 88%','示范')+row('陵江镇敬老院','公办 · 床位 120 张','良好')+row('云峰镇幸福院','民办 · 床位 86 张','良好')+'</div>';}},
renkou:{name:'人口地图',sub:'老年人口空间分布可视化',html:function(){return '<div class="desc-banner">基于地理信息将全县老年人口按乡镇、村（社区）进行空间化展示，直观呈现人口密度、年龄结构与分布趋势。</div><h3>老年人口分布（示例）</h3><div class="metric-grid">'+metric('12.6万','60 岁以上人口')+metric('4.3万','80 岁以上人口')+metric('31','覆盖乡镇（个）')+'</div><h3>分布特点</h3><ul><li>老年人口向县城及中心场镇聚集，农村呈分散分布。</li><li>山区乡镇高龄化比例偏高，留守老人占比明显。</li></ul>';}},

shicheng:{name:'适老商城',sub:'适老化产品与服务商城',html:function(){return '<div class="desc-banner">面向老年人及其家庭提供适老化产品与服务的在线商城，涵盖辅具、改造、健康用品与上门服务等。</div><h3>热销品类（示例）</h3><div class="tag-row"><span class="tag">智能手环</span><span class="tag">护理床垫</span><span class="tag">助行辅具</span><span class="tag">防滑改造</span><span class="tag">智能呼叫</span><span class="tag">健康监测</span></div><h3>运营数据（示例）</h3><div class="metric-grid">'+metric('1560','上架商品')+metric('23800','累计订单')+metric('98.6%','好评率')+'</div>';}},
shegong:{name:'社会工作者',sub:'社工人才队伍与网格服务',html:function(){return '<div class="desc-banner">展示全县社会工作专业人才队伍、持证情况、网格分布与服务开展成效，推动专业化养老服务队伍建设。</div><h3>人才结构（示例）</h3><div class="metric-grid">'+metric('856','社工人员')+metric('312','持证社工')+metric('48','志愿服务队')+'</div><h3>服务网络</h3><ul><li>构建“县—乡镇—村（社区）”三级社工服务网络。</li><li>定期开展走访、评估、帮扶与政策宣传等专业服务。</li></ul>';}},

tongji:{name:'统计图表',sub:'多维数据可视化分析',html:function(){return '<div class="desc-banner">对养老服务关键业务数据进行多维度统计分析，以图表形式直观呈现变化趋势与结构分布。</div><div class="chart-box" id="chart-bar"></div><h3>机构类型占比</h3><div class="chart-box" id="chart-pie"></div>';}},
xiangmu:{name:'项目数据',sub:'项目全生命周期跟踪',html:function(){return '<div class="desc-banner">对养老服务领域工程项目与信息化项目进行立项、建设、验收、运营的全生命周期跟踪管理。</div><h3>项目阶段（示例）</h3><div class="metric-grid">'+metric('18','在建项目')+metric('9','竣工项目')+metric('5','运营项目')+'</div><h3>在建项目（示例）</h3><div class="item-list">'+row('县养老服务中心改扩建','建设进度 62% · 投资 5800 万','在建')+row('乡镇助餐点网络','进度 45% · 覆盖 12 乡镇','在建')+row('智慧养老监管平台','进度 30% · 信息化建设','在建')+'</div>';}},
dangjian:{name:'党建成果',sub:'党建引领养老服务成果',html:function(){return '<div class="desc-banner">展示以党建引领养老服务体系建设的组织覆盖、活动开展与惠民成效，突出党组织战斗堡垒作用。</div><h3>组织建设（示例）</h3><div class="metric-grid">'+metric('100%','党组织覆盖率')+metric('256','党员服务先锋岗')+metric('64','党建服务点')+'</div><h3>特色做法（示例）</h3><ul><li>成立养老服务行业党委，实现机构党组织应建尽建。</li><li>开展“党建+助老”结对帮扶，党员定期走访困难老人。</li><li>推动社区党群服务中心与养老服务站点共建共享。</li></ul>';}},
yanglaocg:{name:'养老成果',sub:'养老服务体系建设成效',html:function(){return '<div class="desc-banner">系统展示苍溪县在养老服务体系建设、服务水平提升方面的整体成效与示范亮点。</div><h3>体系成效（示例）</h3><div class="metric-grid">'+metric('县-乡-村','三级服务网络')+metric('100%','镇街覆盖率')+metric('91%','老人满意度')+'</div><h3>示范亮点（示例）</h3><div class="item-list">'+row('省级养老服务示范县','获评养老服务体系创新试点','示范')+row('智慧养老试点','平台接入机构与床位全量数据','领先')+row('医养结合','实现乡镇卫生院与养老机构签约协作','特色')+'</div>';}}};

var overlay=document.getElementById('overlay');var modal=document.getElementById('modal');var mTitle=document.getElementById('m-title');var mSub=document.getElementById('m-sub');var mBody=document.getElementById('m-body');var mIco=document.getElementById('m-ico');var mClose=document.getElementById('m-close');
function openPanel(key){var d=DATA[key];if(!d)return;mTitle.textContent=d.name;mSub.textContent=d.sub;mIco.innerHTML=ICONS[key];mBody.innerHTML=d.html();overlay.classList.add('open');document.body.style.overflow='hidden';if(key==='tongji'){setTimeout(function(){var bar=document.getElementById('chart-bar');var pie=document.getElementById('chart-pie');if(bar&&window.echarts){echarts.init(bar).setOption({backgroundColor:'transparent',grid:{left:40,right:14,top:30,bottom:26},tooltip:{trigger:'axis'},textStyle:{color:'#c3dcf5'},xAxis:{type:'category',data:['机构','床位','社工','补贴(万)','服务(万)'],axisLine:{lineStyle:{color:'#33567f'}}},yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(64,160,255,.12)'}},axisLine:{lineStyle:{color:'#33567f'}}},series:[{type:'bar',data:[59,4200,856,3600,128],barWidth:'46%',itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#39c8ff'},{offset:1,color:'#0a5ec2'}]),borderRadius:[4,4,0,0]}}]});}if(pie&&window.echarts){echarts.init(pie).setOption({backgroundColor:'transparent',tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#c3dcf5'}},color:['#39c8ff','#ffd76a','#2fa9ff','#9b7bff'],series:[{type:'pie',radius:['42%','68%'],center:['50%','42%'],label:{color:'#d5ecff',fontSize:12},data:[{value:38,name:'公办机构'},{value:21,name:'民办机构'},{value:13,name:'日照中心'},{value:9,name:'其他'}]}]});}},50);}}
function closePanel(){overlay.classList.remove('open');document.body.style.overflow='';}
document.querySelectorAll('.nav-card').forEach(function(card){card.addEventListener('click',function(){openPanel(card.getAttribute('data-panel'));});});
mClose.addEventListener('click',closePanel);
overlay.addEventListener('click',function(e){if(e.target===overlay)closePanel();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});
